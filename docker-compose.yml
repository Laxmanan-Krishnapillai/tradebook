services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tradebook
      POSTGRES_USER: tradebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebook -d tradebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__ConnectionString: Host=postgres;Database=tradebook;Username=tradebook;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: Tradebook
      Jwt__Audience: Tradebook
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
