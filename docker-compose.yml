services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tradebook
      POSTGRES_USER: tradebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/database-ops:/opt/tradebook/database-ops:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username tradebook --dbname tradebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    profiles: ["ops"]
    build:
      context: .
      target: database-ops
    volumes:
      - ops-backup:/tmp/tradebook-backup
    environment:
      PGHOST: postgres
      PGDATABASE: tradebook
      PGUSER: tradebook
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  ops-backup:
