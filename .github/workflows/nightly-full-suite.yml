name: Nightly Full Suite
# Runs the machine-bound tests the PR path filters out (Aspire graph boot,
# reference-machine latency baseline) plus the full unfiltered integration
# suite, so the filtered classes still execute on a schedule.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore src/Backend/Tradebook.sln
      - run: dotnet build src/Backend/Tradebook.sln -c Debug --no-restore -warnaserror
      - run: dotnet test tests/Tradebook.IntegrationTests/Tradebook.IntegrationTests.csproj --no-restore
