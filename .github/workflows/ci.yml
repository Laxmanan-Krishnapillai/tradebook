name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/Backend/**'
              - 'src/Database/**'
              - 'tests/Tradebook.UnitTests/**'
              - 'tests/Tradebook.IntegrationTests/**'
              - 'tests/Tradebook.ArchitectureTests/**'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - '.editorconfig'
              - 'BannedSymbols.txt'
              - 'global.json'
              - '.config/dotnet-tools.json'
              - 'bin/check-banned-api.sh'
              - 'bin/verify.sh'
              - 'scripts/check-contract-drift.sh'
              - 'docs/api/typespec/**'
              - 'docs/architecture/decision-log.md'
              - 'docs/tasks/task-13-platform-currency-and-central-package-management.md'
              - 'tgconfig.json'
              - 'stryker-config.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/Frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'src/Database/Migrations/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Lint pull-request title
        if: github.event_name == 'pull_request'
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$COMMIT_MESSAGE" | npx --no-install commitlint
      - name: Lint pushed commit
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            commits="$(git rev-list --reverse "$HEAD_SHA")"
          else
            commits="$(git rev-list --reverse "$BEFORE_SHA..$HEAD_SHA")"
          fi
          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue
            git show --quiet --format=%B "$commit" | npx --no-install commitlint
          done <<< "$commits"
      - name: Lint every pull-request commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue
            git show --quiet --format=%B "$commit" | npx --no-install commitlint
          done <<< "$commits"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/Frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: src/Frontend
      - run: bash scripts/check-contract-drift.sh

  sql-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 1.29.0
      - name: Regenerate schema-checked C# and reject drift
        shell: bash
        run: |
          sqlc generate
          git diff --exit-code -- src/Backend/src/Tradebook.Infrastructure/Data/generated
          test -z "$(git status --porcelain -- src/Backend/src/Tradebook.Infrastructure/Data/generated)"
      - name: Install sqlfluff
        run: pipx install sqlfluff==3.4.2
      - name: Lint all PostgreSQL SQL
        run: sqlfluff lint src/Database/Migrations src/Backend/src/Tradebook.Infrastructure/Data/queries
      - name: Squawk changed migrations
        uses: sbdchd/squawk-action@v2
        with:
          config: .squawk.toml
          path: src/Database/Migrations

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The integration suite has deadlocked and burned 6h runners before; cap it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore src/Backend/Tradebook.sln
      - run: dotnet restore tests/Tradebook.ArchitectureTests/Tradebook.ArchitectureTests.csproj
      - run: dotnet tool run csharpier check .
      - run: bash bin/check-banned-api.sh
      - run: dotnet build src/Backend/Tradebook.sln -c Debug --no-restore -warnaserror
      - run: dotnet test tests/Tradebook.UnitTests/Tradebook.UnitTests.csproj --no-restore
      # Machine-bound classes (Aspire graph boot, reference-machine latency baseline)
      # run in the nightly full-suite workflow instead of every PR-path run.
      - run: dotnet test tests/Tradebook.IntegrationTests/Tradebook.IntegrationTests.csproj --no-restore -- --filter-not-trait "Category=Aspire" --filter-not-trait "Category=MachineBaseline"
      - run: dotnet test tests/Tradebook.ArchitectureTests/Tradebook.ArchitectureTests.csproj --no-restore
      - run: dotnet stryker --config-file stryker-config.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
        working-directory: src/Frontend
      - run: npm run lint
        working-directory: src/Frontend
      - run: npm run knip
        working-directory: src/Frontend
      - run: npm run build
        working-directory: src/Frontend
      - run: npm test -- --run
        working-directory: src/Frontend

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: pwsh -File infra/validation/verify-tier1.ps1
      - run: bash -n infra/database-ops/*.sh infra/compose/postgres-init/*.sh infra/validation/*.sh
      - run: docker build --target database-ops --tag tradebook-database-ops:ci .
      - run: docker build --target runtime --tag tradebook-api:ci .
      - name: Exercise Compose migrations and backup restore
        shell: bash
        run: |
          export POSTGRES_PASSWORD='ci-local-postgres-only'
          bash infra/validation/verify-backup-restore.sh

  ci-required:
    # `changes` is listed so a paths-filter failure cannot skip build jobs and
    # still let this aggregate pass green on a run where nothing was built.
    needs: [changes, governance, contracts, sql-safety, backend, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to pass (skipped is OK, failure/cancelled is not)
        shell: bash
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "gate results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "a required gate did not pass"; exit 1 ;;
            *) echo "all required gates passed or were skipped" ;;
          esac
