name: Visual QA
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  storybook-argos:
    name: Storybook Argos (required)
    # Argos upload needs the org secret; skip cleanly on forks/repos without it.
    if: ${{ vars.ARGOS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - run: npx @argos-ci/cli upload storybook-static
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  e2e-a11y:
    name: Playwright accessibility and visuals (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Frontend/package-lock.json
            tests/e2e/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: npm ci --prefix src/Frontend && npm ci --prefix tests/e2e
      - name: Boot real stack
        env:
          POSTGRES_PASSWORD: tradebook-e2e-ci
          Database__ConnectionString: Host=127.0.0.1;Port=5432;Database=tradebook;Username=tradebook;Password=tradebook-e2e-ci
          ASPNETCORE_URLS: http://127.0.0.1:5000
          ASPNETCORE_ENVIRONMENT: Testing
          Entra__TenantId: 11111111-1111-1111-1111-111111111111
          Entra__ClientId: 22222222-2222-2222-2222-222222222222
          NO_PROXY: localhost,127.0.0.1
        run: |
          docker compose up -d --wait
          dotnet run --project src/Backend/src/Tradebook.Api/Tradebook.Api.csproj > /tmp/api.log 2>&1 &
          npm --prefix src/Frontend run dev -- --host 127.0.0.1 > /tmp/ui.log 2>&1 &
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:5000/health/ready && curl -fsS http://127.0.0.1:5173; do sleep 2; done' || { echo '=== api.log ==='; tail -50 /tmp/api.log; echo '=== ui.log ==='; tail -20 /tmp/ui.log; exit 124; }
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test --project chromium visual.spec.ts
        working-directory: tests/e2e/src/specs
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
